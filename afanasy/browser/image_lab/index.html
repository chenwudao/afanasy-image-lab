<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Afanasy · 图像作业</title>
<link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/console.css">
<script defer src="/assets/common.js"></script><script defer src="/assets/tasks.js"></script>
<script defer src="/assets/console.js"></script></head>
<body><header><strong>Afanasy</strong><span>图像作业</span><span id="identity"></span><button id="logout" hidden>退出登录</button></header>
<main><form id="login"><h1>登录管理台</h1><label>用户名<input name="name" autocomplete="username" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button>登录</button></form>
<p id="notice" role="status"></p>
<div id="console" hidden><aside><h2>提交图片</h2><form id="upload"><label>图片<input type="file" name="image" accept="image/png,image/jpeg" required></label>
<label>处理操作<select name="operation"><option value="gray">灰度化</option><option value="invert">反色</option></select></label>
<label>优先级<select name="priority"><option value="normal">普通</option><option value="high">高</option></select></label><button>提交作业</button></form>
<h2 id="jobsTitle">我的作业</h2><nav id="jobs"></nav></aside>
<article><p id="empty">请选择或提交一项作业。</p>
<section id="workspace" hidden><div class="heading"><div><h1 id="title"></h1><p id="summary"></p></div><a id="download" hidden>下载 PNG</a></div>
<h2>图块画布</h2><p id="progress"></p><div id="canvas" role="group" aria-label="图块画布"></div>
<h2>进程时间线</h2><div id="timeline"></div>
<h2 id="historyTitle">单块执行历史</h2><div id="nativeTask"></div><ol id="history"></ol>
</section></article></div></main></body></html>
